plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.threadaffinity'
version = '1.0.0'

android {
  namespace "expo.modules.threadaffinity"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
}
